<div class="perfil-container">
  <h2>Mi Perfil Nutricional</h2>

  <div *ngIf="error" class="alert alert-error">
    {{ error }}
  </div>

  <div *ngIf="success" class="alert alert-success">
    Perfil actualizado correctamente
  </div>

  <form (ngSubmit)="guardar()" class="perfil-form">
    <!-- Sexo -->
    <div class="form-group">
      <label>Sexo</label>
      <select [(ngModel)]="formData.sexo" name="sexo" required>
        <option value="Hombre">Hombre</option>
        <option value="Mujer">Mujer</option>
      </select>
    </div>

    <!-- Fecha de Nacimiento -->
    <div class="form-group">
      <label>Fecha de Nacimiento</label>
      <input type="date" [(ngModel)]="formData.fechaNacimiento" name="fecha" required>
    </div>

    <!-- Altura -->
    <div class="form-group">
      <label>Altura (cm)</label>
      <input type="number" [(ngModel)]="formData.alturaCm" name="altura" required min="100" max="250">
    </div>

    <!-- Peso -->
    <div class="form-group">
      <label>Peso (kg)</label>
      <input type="number" [(ngModel)]="formData.pesoKg" name="peso" required min="20" max="300" step="0.1">
    </div>

    <!-- Nivel de Actividad -->
    <div class="form-group">
      <label>Nivel de Actividad</label>
      <select [(ngModel)]="formData.nivelActividad" name="actividad" required>
        <option value="Sedentario">Sedentario</option>
        <option value="Ligero">Ligero</option>
        <option value="Moderado">Moderado</option>
        <option value="Intenso">Intenso</option>
        <option value="Muy intenso">Muy Intenso</option>
      </select>
    </div>

    <!-- Objetivo -->
    <div class="form-group">
      <label>Objetivo</label>
      <select [(ngModel)]="formData.objetivo" name="objetivo" required>
        <option value="Pérdida de peso">Pérdida de Peso</option>
        <option value="Mantenimiento">Mantenimiento</option>
        <option value="Ganancia muscular">Ganancia Muscular</option>
      </select>
    </div>

    <button type="submit" [disabled]="loading" class="btn btn-primary">
      {{ loading ? 'Guardando...' : 'Guardar Perfil' }}
    </button>
  </form>

  <!-- Estadísticas -->
  <div *ngIf="estadisticas.objetivoKcal" class="estadisticas">
    <h3>Tus Objetivos</h3>
    <div class="stats-grid">
      <div class="stat-card">
        <h4>Calorías Diarias</h4>
        <p class="stat-value">{{ estadisticas.objetivoKcal }} kcal</p>
      </div>
      <div class="stat-card">
        <h4>IMC</h4>
        <p class="stat-value">{{ estadisticas.imc }}</p>
      </div>
    </div>
  </div>
</div>
