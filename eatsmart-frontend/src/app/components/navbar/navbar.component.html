<nav class="navbar">
  <div class="navbar-container">

    <!-- Logo y nombre -->
    <a class="navbar-brand" [routerLink]="isAuthenticated() ? '/home' : '/login'">
      <img src="/logoEatSmart.png" alt="EatSmart" class="brand-logo">
      <span class="brand-name">EatSmart</span>
    </a>

    <!-- Botón hamburguesa (solo móvil) -->
    <button class="navbar-toggle" (click)="toggleMenu()" *ngIf="isAuthenticated()" aria-label="Menu">
      <mat-icon>{{ menuAbierto ? 'close' : 'menu' }}</mat-icon>
    </button>

    <!-- Backdrop del drawer (móvil) -->
    <div class="drawer-backdrop" [class.open]="menuAbierto" (click)="cerrarMenu()"></div>

    <!-- Enlaces de navegación -->
    <div class="navbar-menu" [class.open]="menuAbierto" *ngIf="isAuthenticated()">
      <ul class="navbar-nav">
        <li>
          <a routerLink="/home" routerLinkActive="active" (click)="cerrarMenu()">
            <mat-icon>home</mat-icon>
            <span>Inicio</span>
          </a>
        </li>
        <li>
          <a routerLink="/comidas" routerLinkActive="active" (click)="cerrarMenu()">
            <mat-icon>restaurant</mat-icon>
            <span>Mis Comidas</span>
          </a>
        </li>
        <li>
          <a routerLink="/estadisticas" routerLinkActive="active" (click)="cerrarMenu()">
            <mat-icon>insights</mat-icon>
            <span>Estadísticas</span>
          </a>
        </li>
        <li>
          <a routerLink="/alimentos" routerLinkActive="active" (click)="cerrarMenu()">
            <mat-icon>local_dining</mat-icon>
            <span>Alimentos</span>
          </a>
        </li>
        <li>
          <a routerLink="/perfil" routerLinkActive="active" (click)="cerrarMenu()">
            <mat-icon>person</mat-icon>
            <span>Mi Perfil</span>
          </a>
        </li>
      </ul>

      <!-- Selector de idioma + logout (visible en drawer móvil) -->
      <div class="navbar-actions-mobile">
        <div class="language-switcher-mobile">
          <button
            class="lang-btn"
            [class.active]="idiomaActual === 'es'"
            (click)="cambiarIdioma('es')">ES</button>
          <button
            class="lang-btn"
            [class.active]="idiomaActual === 'en'"
            (click)="cambiarIdioma('en')">EN</button>
        </div>
        <button class="btn-logout-mobile" (click)="logout(); cerrarMenu()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </div>

    <!-- Acciones de usuario (escritorio) -->
    <div class="navbar-user" *ngIf="isAuthenticated()">

      <!-- Selector idioma -->
      <div class="language-switcher">
        <button
          class="lang-btn"
          [class.active]="idiomaActual === 'es'"
          (click)="cambiarIdioma('es')">ES</button>
        <button
          class="lang-btn"
          [class.active]="idiomaActual === 'en'"
          (click)="cambiarIdioma('en')">EN</button>
      </div>

      <!-- Menú de usuario -->
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <div class="user-avatar">
          <mat-icon>account_circle</mat-icon>
        </div>
        <span class="user-email">{{ usuarioEmail }}</span>
        <mat-icon class="dropdown-arrow">arrow_drop_down</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" xPosition="before">
        <a mat-menu-item routerLink="/perfil">
          <mat-icon>person</mat-icon>
          <span>Mi Perfil</span>
        </a>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </mat-menu>
    </div>

  </div>
</nav>
